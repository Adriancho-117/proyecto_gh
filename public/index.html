<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Cacería del Demonio Dorado — una historia interactiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="crt-overlay" aria-hidden="true"></div>

<div class="console">
  <div class="console-head">
    <span><span class="sigil">✦</span> runaterra · crónicas de Jonia</span>
    <div class="console-tools">
      <button id="crtToggle" class="crt-toggle" type="button" aria-pressed="true">CRT: activo</button>
      <span id="nodeTag">menú_principal</span>
    </div>
  </div>

  <div class="stage" id="stage" role="region" aria-live="polite" aria-atomic="true" aria-label="Texto de la historia"></div>

  <div class="choices" id="choices" role="group" aria-label="Opciones disponibles"></div>
</div>

<script type="module" src="./main.mjs"></script>
</body>
</html>
